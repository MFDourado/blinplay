<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BlinPlay</title>
<link rel="icon" href="img/blinplay-favicon.png">
<!-- C3 — biblioteca servida do próprio domínio; a CDN vira apenas reserva.
     Baixe uma vez e commite:
        curl -sL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" -o supabase.js
     Sem isso, um comprometimento do jsdelivr executaria código arbitrário
     nos 150 boxes ao mesmo tempo. -->
<script src="config.js"></script>
<script src="supabase.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(s);"></script>
<style>
  :root{ --gold:#F5A800; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
  #stage{position:fixed;inset:0;background:#000}
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .6s ease}
  .slide.on{opacity:1}
  .slide img,.slide video{width:100%;height:100%;object-fit:contain;background:#000}

  /* telas de estado (sem token, carregando, erro) */
  #msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#0a0a0c;color:#f4f3ee;font-family:system-ui,sans-serif;text-align:center;padding:30px;gap:14px}
  #msg.show{display:flex}
  #msg .sym{height:88px;width:auto;filter:drop-shadow(0 0 30px rgba(245,168,0,.4));margin-bottom:4px}
  #msg .wordmark{height:34px;width:auto;opacity:.96}
  #msg p{font-size:16px;color:#9a9aa4;max-width:520px;line-height:1.5}
  #msg .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #msg code{background:rgba(255,255,255,.08);padding:3px 8px;border-radius:6px;font-size:14px;color:#ffd9a0}

  /* selo discreto da campanha (canto), some sozinho */
  #flag{position:fixed;top:20px;right:22px;background:rgba(245,168,0,.92);color:#1a1300;
    font-family:system-ui,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;
    padding:7px 13px;border-radius:8px;text-transform:uppercase;opacity:0;transition:opacity .4s;z-index:5}
  #flag.show{opacity:1}

  /* ---- painel de diagnostico (so aparece com ?diag=1) ---- */
  #hud{position:fixed;left:0;bottom:0;z-index:99;display:none;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#c8f7c8;
    background:rgba(0,0,0,.78);padding:8px 11px;border-top-right-radius:8px;
    white-space:pre;max-width:62vw;pointer-events:none}
  #hud.show{display:block}
  #hud b{color:var(--gold);font-weight:700}
  #prev{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;
    font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#ffd9a0;
    background:rgba(0,0,0,.93);padding:18px 22px;white-space:pre-wrap}
  #prev.show{display:block}
  #prev h1{font:700 15px system-ui,sans-serif;color:var(--gold);margin-bottom:10px}
</style>
</head>
<body>

<div id="stage"></div>
<div id="flag"></div>
<div id="hud"></div>
<div id="prev"></div>

<div id="msg" class="show">
  <img class="sym" src="img/blinplay-favicon.png" alt="">
  <img class="wordmark" src="img/blinplay-simbolo.png" alt="Blincast">
  <div class="spin"></div>
  <p id="msgtxt">Carregando programação…</p>
</div>

<script>
/* ================= CONFIG ================= */
const PLAYER_VERSION = 'v5.0d';   // versão do player — aparece na coluna VERSÃO do painel
const MEDIA_BASE = SB_URL + '/storage/v1/object/public/blinplay-media/';
const RESYNC_FALLBACK_MS = 15 * 1000;  // FALLBACK rápido: checa a cada 15s quando Realtime NÃO está confirmado
let resyncTimer = null;
let realtimeOK = false;  // vira true quando o Realtime confirma a conexão

/* Toca a última programação salva, sem servidor. Usado quando o SDK do
   Supabase não carregou (CDN fora, primeiro boot sem rede). */
function tentarModoLocal(code, tok){
  try{
    if(!tok && code){ tok = localStorage.getItem('blinplay_code_'+code); }
    if(!tok){
      showMsg('Sem conexão e sem configuração salva.<br>Conecte à internet para configurar.', false);
      return;
    }
    token = tok;
    const salvo = JSON.parse(localStorage.getItem('blinplay_sched_'+tok) || 'null');
    if(!salvo){
      showMsg('Sem conexão.<br>Aguardando configuração inicial.', true);
      return;
    }
    aplicarPrograma(salvo, true);
    logar('MODO LOCAL: tocando a ultima programacao salva');
  }catch(e){
    showMsg('Sem conexão.<br>Aguardando rede.', true);
  }
}

/* ================= PORTAO DE AUTORIZACAO =================
   Box novo entra em espera ate alguem liberar no painel. Motivo: na
   migracao de ~150 boxes, um digito errado no codigo de 6 digitos coloca
   um box no canal de outro hotel — e conteudo de cliente vaza para tela
   de cliente. O portao troca esse risco por um clique de aprovacao.

   Canais que ja existiam foram marcados como autorizados no SQL, entao a
   frota atual nao para. */
let autorizado = null;          // null = ainda nao verificado
let portaoInstalado = true;     // vira false se a RPC não existir no banco

/* Teto de recargas por sessão. Recarregar é uma ferramenta legítima, mas
   nenhuma condição justifica recarregar sem parar: se o teto for atingido,
   é sinal de que a lógica está errada, e ficar tocando vale mais do que
   insistir num reload que não resolve. */
let recargas = 0;
const MAX_RECARGAS = 3;

/* Sinal EXPLÍCITO de "a programação já foi aplicada".
   Antes eu usava lastSig como esse sinal — mas canal vazio produz assinatura
   vazia, então lastSig ficava falso para sempre e o polling reaplicava o
   programa a cada 2 minutos, sem fim. Estado precisa de variável própria,
   não de efeito colateral de outra. */
let programaAplicado = false;
let esperaAutorizacao = null;

async function verificarAutorizacao(){
  if(!sb || !token) return true;
  try{
    const { data, error } = await sb.rpc('verificar_autorizacao', { p_token: token });
    if(error) throw error;
    const r = (data && data[0]) || null;
    if(!r) return true;                       // sem resposta: nao bloqueia
    autorizado = !!r.autorizado;
    // memoriza para sobreviver a quedas de rede sem reabrir a brecha
    try{
      if(autorizado) localStorage.setItem('blinplay_autorizado_'+token,'1');
      else           localStorage.removeItem('blinplay_autorizado_'+token);
    }catch(e){}
    return autorizado;
  }catch(e){
    const msg = String((e && e.message) || e);

    /* PORTÃO NÃO INSTALADO NO BANCO.
       Se a RPC não existe, o recurso simplesmente não foi habilitado neste
       projeto — e nesse caso ele não deve bloquear nada. Endurecer o A4 sem
       essa verificação derrubou um box de produção: a RPC devolvia 404, o
       player tratava como "não autorizado" e ficava na tela de espera,
       reiniciando a cada dois minutos.
       Portão que não existe não reprova ninguém. */
    if(/Could not find the function|PGRST202|does not exist|404/i.test(msg)){
      portaoInstalado = false;
      autorizado = true;
      logar('AUTORIZACAO: portão não instalado no banco — seguindo sem bloqueio');
      return true;
    }

    /* A4 — falha de REDE com o portão instalado:
         · já foi autorizado alguma vez  -> continua tocando (offline legítimo)
         · nunca foi autorizado          -> espera. Tela de espera é ruim;
           conteúdo de um hotel na tela de outro é pior. */
    let jaFoi = false;
    try{ jaFoi = localStorage.getItem('blinplay_autorizado_'+token) === '1'; }catch(err){}
    logar('AUTORIZACAO nao verificada ('+msg.slice(0,40)+
          ') — '+(jaFoi?'liberado por autorizacao anterior':'BLOQUEADO, nunca autorizado'));
    return jaFoi;
  }
}

function telaAguardandoAutorizacao(){
  showMsg('Estação aguardando liberação.<br>' +
          '<span style="font-size:.62em;opacity:.75">Código ' +
          escP(localStorage.getItem('blinplay_ultimo_code')||'') +
          ' · libere no painel BlinPlay</span>', true);
  logar('AGUARDANDO AUTORIZACAO');
  clearInterval(esperaAutorizacao);
  esperaAutorizacao = setInterval(async ()=>{
    /* Exige aprovação EXPLÍCITA. Antes o laço usava o retorno da função, que
       é "falha para aberto" — então uma instabilidade de rede liberava um box
       que nunca foi autorizado. Aqui só sai da espera com autorizado===true. */
    await verificarAutorizacao();
    if(!portaoInstalado){
      clearInterval(esperaAutorizacao);
      logar('AUTORIZACAO: portao ausente — liberando');
      hideMsg();
      sincronizar(true);
      return;
    }
    if(autorizado === true){
      clearInterval(esperaAutorizacao);
      logar('AUTORIZADO — iniciando');
      hideMsg();
      sincronizar(true);
    }
  }, 20000);
}

/* o box se apresenta: alimenta a fila de autorizacao com informacao util */
async function apresentarBox(){
  if(!sb || !token) return;
  let livre = null, total = null;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      livre = Math.max(0, Math.round((e.quota||0) - (e.usage||0)));
      total = Math.round(e.quota||0);
    }
  }catch(e){}
  let mac = null;
  try{ if(window.BlinPlayNative && window.BlinPlayNative.mac) mac = window.BlinPlayNative.mac(); }catch(e){}
  try{
    await sb.rpc('apresentar_box', {
      p_token: token, p_ip: null, p_mac: mac, p_livre: livre, p_total: total
    });
  }catch(e){}
}

/* ================= DIAGNOSTICO =================
   Ativado por ?diag=1 na URL. Objetivo: descobrir a causa de uma falha
   em box SEM rede e SEM Fully, onde a tela e o unico canal de saida.

   Como funciona: eventos e amostras periodicas vao para um anel de 220
   entradas gravado em localStorage a cada escrita. Se o processo morrer
   ou congelar, o registro JA esta em disco. No boot seguinte, a sessao
   anterior e exibida em tela cheia por 90s -- basta fotografar.
*/
const LOG_KEY  = 'blinplay_log';
const LOG_PREV = 'blinplay_log_prev';
const LOG_MAX  = 220;
let DIAG = false;
let LOG = [];
let bootEm = Date.now();
let voltas = 0, erros = 0, trocas = 0;

/* Escape de HTML também no player.
   O painel de diagnóstico e a tela de sessão anterior montam markup com
   dados vindos do banco (caminho da mídia, mensagens de erro). É o próprio
   box, então o impacto é menor que no painel — mas é a mesma classe de
   problema, e diagnóstico é onde menos se quer surpresa. */
function escP(v){
  if(v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function hhmmss(ms){
  const t=Math.floor(ms/1000);
  return String(Math.floor(t/3600)).padStart(2,'0')+':'+
         String(Math.floor(t/60)%60).padStart(2,'0')+':'+
         String(t%60).padStart(2,'0');
}
let gravarLogTimer = null;
function logar(msg){
  const e = hhmmss(Date.now()-bootEm)+' '+msg;
  LOG.push(e);
  if(LOG.length>LOG_MAX) LOG.splice(0, LOG.length-LOG_MAX);

  /* B5 — antes gravava as 220 entradas em disco a CADA evento. Numa rajada de
     erros isso é um JSON.stringify síncrono mais uma escrita por evento, no
     aparelho que já está sofrendo — justamente quando o log importa.
     Agora agrupa: escreve no máximo uma vez por segundo. */
  if(!gravarLogTimer){
    gravarLogTimer = setTimeout(()=>{
      gravarLogTimer = null;
      try{ localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); }catch(err){}
    }, 1000);
  }
  if(DIAG) console.log('[BlinPlay]', e);
}
function heapMB(){
  try{
    const m = performance && performance.memory;
    if(!m) return null;
    return { usado:+(m.usedJSHeapSize/1048576).toFixed(1),
             total:+(m.totalJSHeapSize/1048576).toFixed(1),
             limite:+(m.jsHeapSizeLimit/1048576).toFixed(1) };
  }catch(e){ return null; }
}
let ultEstimate = null;
/* serie de heap para calcular TENDENCIA. E isso que permite concluir em
   15 min em vez de esperar o colapso: se a inclinacao e positiva e
   sustentada, ha vazamento; se oscila em torno de zero, nao ha. */
let serieHeap = [];   // {t, usado}
function tendenciaHeap(){
  if(serieHeap.length < 3) return null;
  const t0 = serieHeap[0], tn = serieHeap[serieHeap.length-1];
  const min = Math.min(...serieHeap.map(p=>p.usado));
  const max = Math.max(...serieHeap.map(p=>p.usado));
  const mins = (tn.t - t0.t)/60000;
  const incl = mins > 0.5 ? (tn.usado - t0.usado)/mins : null;
  return { min, max, incl, mins, amostras: serieHeap.length };
}
function veredito(){
  const d = tendenciaHeap();
  if(!d || d.mins < 5) return 'medindo (precisa de ~5 min)';
  if(d.incl === null) return 'medindo';
  if(d.incl > 0.8)  return 'VAZAMENTO: +'+d.incl.toFixed(2)+' MB/min';
  if(d.incl > 0.25) return 'suspeito: +'+d.incl.toFixed(2)+' MB/min';
  return 'ESTÁVEL ('+d.incl.toFixed(2)+' MB/min)';
}
async function amostrar(){
  const h = heapMB();
  if(h){
    serieHeap.push({ t: Date.now(), usado: h.usado });
    if(serieHeap.length > 240) serieHeap.shift();
  }
  let st = '';
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      ultEstimate = e;
      st = ' cache='+(e.usage/1048576).toFixed(1)+'MB/'+(e.quota/1048576).toFixed(0)+'MB';
    }
  }catch(e){}
  const tt = tendenciaHeap();
  logar('AMOSTRA up='+hhmmss(Date.now()-bootEm)+
        (tt? ' tend='+(tt.incl===null?'?':tt.incl.toFixed(2))+'MB/min min='+tt.min+' max='+tt.max : '')+
        ' voltas='+voltas+' trocas='+trocas+' erros='+erros+
        (h? ' heap='+h.usado+'/'+h.total+'MB (lim '+h.limite+')' : ' heap=n/d')+
        st);
}

/* estado do Service Worker: a pergunta central em box com APK proprio.
   Se nao houver SW controlando, todo o cache offline esta por conta do
   cache HTTP da WebView -- que nao da garantia nenhuma. */
/* Device Owner e kiosk nativo: informado pelo APK quando disponivel */
/* estado real do audio do item que esta na tela */
function estadoAudio(){
  try{
    const st = document.getElementById('stage');
    const on = st && (st.querySelector('.slide.on') || st.lastElementChild);
    const v  = on && on.querySelector ? on.querySelector('video') : null;
    if(!v) return 'sem vídeo na tela';
    return v.muted ? 'MUDO' : ('com som (vol '+Math.round((v.volume||0)*100)+'%)');
  }catch(e){ return 'n/d'; }
}

function infoOwner(){
  try{
    if(!window.BlinPlayNative || !window.BlinPlayNative.ehDeviceOwner) return 'ponte antiga';
    const o = window.BlinPlayNative.ehDeviceOwner();
    if(!o) return 'NÃO provisionado';
    let k = false;
    try{ k = window.BlinPlayNative.kiosk(); }catch(e){}
    return 'SIM' + (k ? ' · kiosk ativo' : ' · kiosk inativo');
  }catch(e){ return 'n/d'; }
}

function estadoSW(){
  if(!('serviceWorker' in navigator)) return 'INDISPONÍVEL (WebView sem SW)';
  if(!navigator.serviceWorker.controller) return 'NÃO CONTROLA (registrado? aguarde/reload)';
  return 'ATIVO';
}

function pintarHud(){
  if(!DIAG) return;
  const h = heapMB();
  const item = playlist[idx];
  const linhas = [
    '<b>BlinPlay '+PLAYER_VERSION+'</b>  up '+hhmmss(Date.now()-bootEm),
    'SW.......: '+estadoSW(),
    'owner....: '+infoOwner(),
    'portão...: '+(portaoInstalado ? (autorizado===true?'autorizado':'aguardando') : 'não instalado'),
    'recargas.: '+recargas+'/'+MAX_RECARGAS,
    'mídia....: '+(NATIVO? 'NATIVA (arquivo do app)' : 'cache do navegador'),
    'persist..: '+persistOK+(NATIVO? '  (irrelevante no modo nativo)' : ''),
    'rede.....: '+(navigator.onLine? 'online':'OFFLINE'),
    'cache....: '+(ultEstimate? (ultEstimate.usage/1048576).toFixed(1)+' MB de '+(ultEstimate.quota/1048576).toFixed(0)+' MB' : 'medindo...'),
    'heap.....: '+(h? h.usado+' / '+h.total+' MB  (limite '+h.limite+')' : 'n/d'),
    'playlist.: '+playlist.length+' itens, indisp='+indisponiveis.size,
    'mídias...: '+auditoria.ok+'/'+auditoria.total+' em cache'+
      (auditoria.faltando.length? '  <b>FALTAM '+auditoria.faltando.length+'</b>' : ''),
    'tocando..: #'+idx+' '+(item? escP((item.tipo||'?')+' '+String(item.path||'').slice(-26)) : '-'),
    'voltas...: '+voltas+'   trocas: '+trocas+'   erros: '+erros,
    '<b>VEREDITO: '+veredito()+'</b>',
    'envio log: '+statusEnvio,
    'kotlin...: '+escP(relatoKotlin),
    'captura..: '+snapEstado,
    'áudio....: '+estadoAudio()
  ];
  document.getElementById('hud').innerHTML = linhas.join('\n');
}

/* A tela cheia com o log da sessao anterior foi desativada: ficava 90s na
   frente do conteudo. O registro continua sendo gravado em disco e enviado
   ao Supabase. Para reativar em campo, chame mostrarSessaoAnterior(). */
function mostrarSessaoAnterior(){
  let prev=null;
  try{ prev = JSON.parse(localStorage.getItem(LOG_PREV)||'null'); }catch(e){}
  if(!prev || !prev.length) return;
  const el = document.getElementById('prev');
  const ult = prev.slice(-70);
  el.innerHTML = '<h1>SESSAO ANTERIOR — '+prev.length+' eventos (ultimos '+ult.length+
                 '). Fotografe esta tela. Sai em 90s.</h1>' + ult.map(escP).join('\n');
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 90000);
}

/* ---- liga/desliga o painel pelo CONTROLE REMOTO ----
   Necessario porque em APK proprio a URL costuma ser montada pelo app,
   sem onde acrescentar ?diag=1. Quatro toques rapidos em QUALQUER botao
   (OK serve) dentro de 3s alternam o painel. O REGISTRO em disco roda
   sempre, independente do painel estar visivel. */
let toques = [];
let hudTimer = null;
function ligarPinturaHud(){
  if(hudTimer) return;
  hudTimer = setInterval(pintarHud, 2000);
}
function desligarPinturaHud(){
  if(!hudTimer) return;
  clearInterval(hudTimer); hudTimer = null;
}

function alternarDiag(){
  DIAG = !DIAG;
  const hud = document.getElementById('hud');
  if(DIAG){
    hud.classList.add('show');
    pintarHud();
    ligarPinturaHud();
    logar('DIAG ligado pelo controle');
  }else{
    hud.classList.remove('show');
    desligarPinturaHud();
    document.getElementById('prev').classList.remove('show');
    logar('DIAG desligado');
  }
}
function registrarToque(){
  const agora = Date.now();
  toques.push(agora);
  toques = toques.filter(t=> agora - t < 3000);
  if(toques.length >= 4){ toques = []; alternarDiag(); }
}

/* ---- ENVIO DO LOG PARA O SUPABASE ----
   A frota esta online 24/7. Em vez de fotografar TV, o box entrega o
   registro sozinho. Fila em localStorage: se estiver offline, acumula e
   envia quando a rede voltar. O log da sessao que MORREU e o primeiro a
   subir no boot seguinte -- e ai a falha aparece no painel sem ninguem
   estar na frente do box. */
let statusEnvio = 'aguardando';
let relatoKotlin = '-';
const FILA_KEY = 'blinplay_fila_log';

function enfileirar(pacote){
  try{
    const f = JSON.parse(localStorage.getItem(FILA_KEY)||'[]');
    f.push(pacote);
    while(f.length > 12) f.shift();          // nao cresce sem limite
    localStorage.setItem(FILA_KEY, JSON.stringify(f));
  }catch(e){}
}

async function esvaziarFila(){
  if(!sb || !token){ statusEnvio='sem token'; return; }
  let f = [];
  try{ f = JSON.parse(localStorage.getItem(FILA_KEY)||'[]'); }catch(e){ return; }
  if(!f.length){ statusEnvio='fila vazia'; return; }
  statusEnvio = 'enviando '+f.length+'...';
  const restantes = [];
  for(const pac of f){
    try{
      const { error } = await sb.rpc('gravar_log_player', {
        p_token:   token,
        p_versao:  PLAYER_VERSION,
        p_sessao:  pac.sessao,
        p_motivo:  pac.motivo,
        p_eventos: pac.eventos
      });
      if(error) throw error;
    }catch(e){
      const cod = (e && (e.code || e.status)) || '?';
      logar('LOG RPC erro cod='+cod+' msg='+String((e&&e.message)||e).slice(0,110));
      restantes.push(pac);
    }
  }
  try{ localStorage.setItem(FILA_KEY, JSON.stringify(restantes)); }catch(e){}
  statusEnvio = restantes.length ? 'pendente '+restantes.length : 'enviado ok';
  logar('ENVIO-LOG '+statusEnvio);
}

/* ---- AUDITORIA DE CACHE / DETECTOR DE EVICTION ----
   Com persist() NEGADO o Android pode apagar a midia a qualquer momento.
   Isso e indetectavel sem medicao: o sintoma na tela e igual ao de um
   arquivo corrompido. Aqui guardamos a lista esperada em localStorage e,
   a cada boot e a cada 30 min, conferimos o que REALMENTE esta no cache.
   Se um arquivo que existia desaparece, o log diz isso com nome e hora --
   e ai eviction deixa de ser hipotese. */
const MIDIAS_KEY = 'blinplay_midias';
let auditoria = { ok:0, total:0, faltando:[] };

function registrarEsperados(paths){
  try{ localStorage.setItem(MIDIAS_KEY, JSON.stringify(paths)); }catch(e){}
}

async function auditarCache(){
  let esperados = [];
  try{ esperados = JSON.parse(localStorage.getItem(MIDIAS_KEY)||'[]'); }catch(e){}
  if(!esperados.length){ return; }

  // modo nativo: quem sabe da midia e o Kotlin
  if(NATIVO){
    let bruto = '';
    try{ relatoKotlin = String(window.BlinPlayNative.ultimoSync()||'-').slice(0,70); }catch(e){}
    try{ bruto = String(window.BlinPlayNative.relatorioMidias(JSON.stringify(esperados))||''); }
    catch(e){ logar('NATIVO ponte falhou: '+String(e&&e.message||e).slice(0,50)); return; }

    /* Leitura TOLERANTE: nao usa JSON.parse. Um separador decimal errado
       vindo do locale do aparelho ("mb":42,0) gerava JSON invalido e cegava
       a auditoria inteira. Agora cada numero e extraido isoladamente. */
    const num = (chave)=>{
      const m = new RegExp('"'+chave+'"\\s*:\\s*(-?[0-9]+)').exec(bruto);
      return m ? parseInt(m[1], 10) : null;
    };
    const ok = num('ok'), total = num('total'), faltam = num('faltam'), mb = num('mb');

    if(ok === null || total === null){
      logar('NATIVO relatorio ilegivel: '+bruto.slice(0,80));
      return;
    }
    auditoria = { ok: ok, total: total || esperados.length,
                  faltando: (faltam ? new Array(faltam).fill('?') : []) };
    logar('NATIVO midias '+auditoria.ok+'/'+auditoria.total+' ('+(mb===null?'?':mb)+' MB)');
    return;
  }
  if(!('caches' in window)){ logar('AUDITORIA indisponivel (sem Cache API)'); return; }
  try{
    const c = await caches.open('media-v1');
    let ok = 0, bytes = 0;
    const faltando = [];
    for(const path of esperados){
      const r = await c.match(MEDIA_BASE + path);
      if(!r){ faltando.push(String(path).slice(-26)); continue; }
      ok++;
      const cl = +(r.headers.get('Content-Length')||0);
      if(cl) bytes += cl;
    }
    const antes = auditoria.ok;
    auditoria = { ok, total: esperados.length, faltando };

    logar('AUDITORIA cache '+ok+'/'+esperados.length+
          ' ('+(bytes/1048576).toFixed(1)+' MB)'+
          (faltando.length ? ' AUSENTES: '+faltando.join(' ') : ''));

    // o achado que importa: estava presente antes e sumiu agora
    if(antes > 0 && ok < antes){
      erros++;
      logar('*** EVICTION DETECTADA: caiu de '+antes+' para '+ok+' arquivos ***');
      enfileirar({ sessao:'viva', motivo:'EVICTION',
                   eventos: LOG.slice(-40) });
      esvaziarFila();
    }
    if(faltando.length && !navigator.onLine){
      logar('ATENCAO: faltam '+faltando.length+' arquivos e o box esta OFFLINE (sem recuperacao)');
    }
  }catch(e){
    logar('AUDITORIA falhou: '+String(e&&e.message||e).slice(0,60));
  }
}

/* ================= CAPTURA DE QUADRO (miniatura sob demanda) =========
   O painel escreve snap_pedido_em; o box recebe por Realtime, desenha o
   quadro VISIVEL num canvas e envia como JPEG base64.

   Por que isso e diferente de "ver player ao vivo": aquele abre uma
   segunda reproducao no navegador de quem olha. Este e o quadro que o
   BOX esta realmente renderizando — a unica forma de ver placeholder,
   congelamento ou midia velha.

   Riscos reais, tratados aqui: canvas contaminado por falta de CORS, e
   quadro preto quando o WebView decodifica por hardware e nao expoe os
   pixels. Os dois sao detectados e reportados em vez de falhar calado. */
let snapUltimoPedido = 0;
let snapEstado = 'nao testado';

function elementoVisivel(){
  const stage = document.getElementById('stage');
  if(!stage) return null;
  const on = stage.querySelector('.slide.on') || stage.lastElementChild;
  if(!on || !on.querySelector) return null;
  return on.querySelector('video') || on.querySelector('img');
}

function capturarQuadro(){
  const el = elementoVisivel();
  if(!el) return { erro:'sem elemento visivel' };

  const lw = el.videoWidth  || el.naturalWidth  || 0;
  const lh = el.videoHeight || el.naturalHeight || 0;
  if(!lw || !lh) return { erro:'sem dimensoes (midia nao carregou)' };

  const larg = 640;
  const alt  = Math.max(90, Math.round(larg * (lh/lw)));
  const c = document.createElement('canvas');
  c.width = larg; c.height = alt;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,larg,alt);

  try{ ctx.drawImage(el, 0, 0, larg, alt); }
  catch(e){ return { erro:'drawImage '+((e&&e.name)||'?') }; }

  // quadro preto => caminho de decodificacao por hardware nao expoe pixels
  try{
    const px = ctx.getImageData(0,0,larg,alt).data;
    let soma=0, n=0;
    for(let i=0;i<px.length;i+=4*499){ soma += px[i]+px[i+1]+px[i+2]; n+=3; }
    if(n && (soma/n) < 3) return { erro:'quadro preto (decodificacao por hardware)' };
  }catch(e){ return { erro:'canvas contaminado: '+((e&&e.name)||'?') }; }

  let url;
  try{ url = c.toDataURL('image/jpeg', 0.55); }
  catch(e){ return { erro:'toDataURL '+((e&&e.name)||'?') }; }

  const b64 = (url.split(',')[1] || '');
  if(b64.length < 500) return { erro:'imagem vazia' };
  return { b64: b64, kb: Math.round(b64.length/1024) };
}

async function enviarSnap(motivo){
  const r = capturarQuadro();
  if(r.erro){
    snapEstado = 'FALHA: ' + r.erro;
    logar('SNAP '+motivo+' '+snapEstado);
    return false;
  }
  if(!sb || !token){ snapEstado = 'sem token'; return false; }
  try{
    const item = playlist[idx];
    const { error } = await sb.rpc('gravar_snap', {
      p_token: token,
      p_jpeg:  r.b64,
      p_item:  item ? String(item.path||'').slice(-60) : null
    });
    if(error) throw error;
    snapEstado = 'ok ('+r.kb+' KB)';
    logar('SNAP enviado '+motivo+' '+r.kb+' KB');
    return true;
  }catch(e){
    // Detalhar de verdade: code + message + hint. "envio falhou" sozinho
    // nao diz se e 404 de schema cache, permissao, tamanho ou rede.
    const cod = (e && (e.code || e.status)) || '?';
    const msg = String((e && (e.message || e.error_description)) || e || '?');
    const hint = (e && (e.hint || e.details)) ? ' | '+String(e.hint||e.details) : '';
    snapEstado = 'envio falhou ['+cod+'] '+msg.slice(0,60);
    logar('SNAP RPC erro cod='+cod+' msg='+msg.slice(0,120)+hint.slice(0,80));
    return false;
  }
}

/* ISOLAMENTO POR CANAL DO ESTADO LOCAL.
   As chaves de código, programação e autorização já eram namespaced por
   token. As de log, fila de envio e lista de mídias não eram — e ficavam no
   aparelho depois de trocar o canal do box. A fila pendente do hotel
   anterior subia com o token NOVO, misturando diagnóstico entre clientes.
   Aqui, ao detectar troca de canal, o estado do canal anterior é descartado. */
function limparEstadoDeOutroCanal(){
  try{
    const anterior = localStorage.getItem('blinplay_token_atual');
    if(anterior === token) return;
    if(anterior){
      [LOG_KEY, LOG_PREV, FILA_KEY, MIDIAS_KEY].forEach(k=>{
        try{ localStorage.removeItem(k); }catch(e){}
      });
      LOG = [];
      console.log('[BlinPlay] canal mudou — estado local do canal anterior descartado');
    }
    localStorage.setItem('blinplay_token_atual', token || '');
  }catch(e){}
}

function iniciarDiag(){
  // rotaciona: o log desta sessao vira "anterior" na proxima abertura
  try{
    const atual = localStorage.getItem(LOG_KEY);
    if(atual) localStorage.setItem(LOG_PREV, atual);
    localStorage.removeItem(LOG_KEY);
  }catch(e){}
  LOG = [];
  // a sessao que morreu vai para a fila de envio imediatamente
  try{
    const ant = JSON.parse(localStorage.getItem(LOG_PREV)||'null');
    if(ant && ant.length){
      enfileirar({ sessao:'anterior', motivo:'reinicio/queda', eventos: ant.slice(-160) });
    }
  }catch(e){}
  logar('BOOT player='+PLAYER_VERSION+' online='+navigator.onLine+
        ' ua='+(navigator.userAgent||'').slice(0,70));
  logar('SW inicial: '+estadoSW());

  window.addEventListener('error', (ev)=>{
    erros++;
    logar('JS-ERRO '+(ev.message||'?')+' @'+(ev.filename||'?')+':'+(ev.lineno||0));
  });
  window.addEventListener('unhandledrejection', (ev)=>{
    erros++;
    logar('PROMISE-REJEITADA '+String((ev.reason&&ev.reason.message)||ev.reason||'?').slice(0,120));
  });
  window.addEventListener('online',  ()=>{
    logar('REDE online');
    rtEspera = 10000;
    clearTimeout(rtRetry);
    rtRetry = setTimeout(ligarRealtime, 2000);
  });
  window.addEventListener('offline', ()=> logar('REDE offline'));

  window.addEventListener('keydown',     registrarToque);
  window.addEventListener('pointerdown', registrarToque);

  if(DIAG){
    document.getElementById('hud').classList.add('show');
  }
  /* pintarHud disparava a cada 2 s para sempre, mesmo com o painel escondido
     — 43 mil execuções por dia sem função nenhuma num aparelho que precisa
     durar. Agora o timer só existe enquanto o painel está visível. */
  if(DIAG) ligarPinturaHud();
  setInterval(amostrar, 60000);    // amostra de memoria a cada minuto -> disco
  amostrar();
  logar('DIAG por controle: 4 toques rapidos em qualquer botao');

  // sobe o que estiver na fila: no boot, quando a rede volta, e a cada 30 min
  setTimeout(esvaziarFila, 8000);
  // ponte nativa no boot: usa a ultima programacao salva, sem esperar o sync.
  // Assim o Kotlin recebe a lista mesmo se a rede ou o render falharem.
  setTimeout(()=>{
    if(!NATIVO) return;
    let salvos = [];
    try{ salvos = JSON.parse(localStorage.getItem(MIDIAS_KEY)||'[]'); }catch(e){}
    if(!salvos.length){
      // ainda nao temos lista: tenta extrair da programacao salva
      try{
        const tk = token || '';
        const sched = JSON.parse(localStorage.getItem('blinplay_sched_'+tk)||'null');
        if(sched){
          (sched.padrao||[]).forEach(m=> salvos.push(m.path));
          (sched.campanhas||[]).forEach(c=> (c.itens||[]).forEach(it=> salvos.push(it.path)));
          if(salvos.length) registrarEsperados(salvos);
        }
      }catch(e){}
    }
    if(salvos.length){
      try{
        window.BlinPlayNative.sincronizarMidias(JSON.stringify(salvos));
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.controller.postMessage({ tipo:'nativo' });
        }
        logar('NATIVO boot sync: '+salvos.length+' midias');
      }catch(e){ logar('NATIVO boot falhou'); }
    }else{
      logar('NATIVO boot: sem lista salva ainda');
    }
  }, 6000);

  // AUTOTESTE: uma captura no boot. Alem de dar ao painel uma primeira
  // imagem, revela em UM restart se este WebView permite capturar quadro.
  setTimeout(()=> enviarSnap('autoteste'), 12000);

  setTimeout(auditarCache, 12000);          // auditoria no boot
  /* M4 — o comentário do bloco prometia 30 min e o código fazia 60 s. Num
     canal com dezenas de arquivos isso é um caches.match() por arquivo a cada
     minuto, para sempre, num Android barato. Vale 5 min: informação fresca o
     bastante para o diagnóstico, sem o desperdício. */
  setInterval(auditarCache, 5*60*1000);

  // recuperacao automatica: falha transitoria nao pode barrar midia para sempre
  setInterval(()=>{
    if(indisponiveis.size){
      logar('RECUPERACAO: liberando '+indisponiveis.size+' item(ns) indisponivel(is)');
      indisponiveis.clear();
      semMidiaAvisado = false;
      if(playlist.length){ idx = 0; tocar(); }
    }
  }, 10*60*1000);
  window.addEventListener('online', ()=> setTimeout(esvaziarFila, 4000));
  setInterval(()=>{
    // enfileira um retrato periodico da sessao viva e tenta subir
    const tt = tendenciaHeap();
    enfileirar({ sessao:'viva', motivo:'amostra periodica',
                 eventos: LOG.slice(-60).concat(['TENDENCIA '+veredito()]) });
    esvaziarFila();
  }, 30*60*1000);
}

   A ponte existir nao basta — a interceptacao de midia pela WebView nao

const NATIVO = (function(){

    const q = new URLSearchParams(location.search).get('nativo') === '1';

/* ================= ESTADO ================= */
let sb = null;
let token = null;
let playlist = [];      // sequência final já montada (padrão + campanhas no rodízio)
let idx = 0;
let slideTimer = null;
let lastSig = '';       // assinatura da playlist (pra trocar só quando muda)
let CHANNEL_ID = null;  // id do canal (vem da RPC) — usado no Realtime
let rtChannel = null;   // canal de assinatura Realtime
let rtDebounce = null;  // evita re-sync múltiplo em rajada de eventos
let rtRetry = null;     // timer de reconexão do Realtime (com recuo)
let rtEspera = 10000;   // espera atual do recuo exponencial (teto 5 min)

/* ---- controle de ciclo (regime 24/7) ----
   geracao: cada tocar() incrementa. Todo callback assíncrono guarda a
   geração em que nasceu e desiste se ela já passou. Isso mata, de forma
   determinística, qualquer cadeia de avanço órfã — a causa do laço em
   que um erro de mídia gerava um <video> novo por segundo, sem parar. */
let geracao = 0;
let errTimer = null;          // timer do caminho de erro (agora cancelável)
const indisponiveis = new Set();  // paths que falharam: saem do rodízio
let semMidiaAvisado = false;

/* ================= HELPERS UI ================= */
function showMsg(txt, spinning){
  const m=document.getElementById('msg');
  document.getElementById('msgtxt').innerHTML = txt;
  m.querySelector('.spin').style.display = spinning ? 'block' : 'none';
  m.classList.add('show');
}
function hideMsg(){ document.getElementById('msg').classList.remove('show'); }

/* ================= MONTAGEM DO RODÍZIO =================
   Recebe o JSON do banco e monta a sequência final:
   conteúdo padrão na ordem, e cada campanha entra "1 a cada N itens".
   Ex: freq=4  ->  padrão,padrão,padrão,CAMPANHA,padrão,padrão,padrão,CAMPANHA...
*/
function montarPlaylist(data){
  const padrao = (data.padrao||[]).map(m=>({...m, camp:false, campNome:null}));
  const camps  = (data.campanhas||[]).filter(c=>c && c.itens && c.itens.length);

  if(padrao.length===0 && camps.length===0) return [];

  // se não há padrão, toca só as campanhas em sequência
  if(padrao.length===0){
    const out=[];
    camps.forEach(c=> c.itens.forEach(it=> out.push({...it, camp:true, campNome:c.nome})));
    return out;
  }

  // PRESENÇA MÍNIMA GARANTIDA:
  // o intervalo efetivo nunca passa do tamanho do padrão — assim toda campanha
  // ativa entra PELO MENOS 1x por volta do rodízio, independente do N escolhido.
  // O N só REDUZ o intervalo (= mais presença) quando o padrão é grande.
  const out=[];
  let count=0;
  const campPtr = camps.map(()=>0);   // ponteiro circular das mídias de cada campanha
  const campInseriu = camps.map(()=>false); // se a campanha já entrou nesta volta

  for(let i=0;i<padrao.length;i++){
    out.push(padrao[i]); count++;
    camps.forEach((c,ci)=>{
      // intervalo pedido, mas no máximo o tamanho do padrão (garante 1x/volta)
      const N = Math.min(Math.max(1, c.frequencia_a_cada||4), padrao.length);
      if(count % N === 0){
        const it = c.itens[campPtr[ci] % c.itens.length];
        campPtr[ci]++; campInseriu[ci]=true;
        out.push({...it, camp:true, campNome:c.nome});
      }
    });
  }

  // rede de segurança: se por algum arredondamento uma campanha não entrou
  // nenhuma vez nesta volta, insere ela 1x no fim — nunca fica de fora.
  camps.forEach((c,ci)=>{
    if(!campInseriu[ci]){
      const it = c.itens[campPtr[ci] % c.itens.length];
      out.push({...it, camp:true, campNome:c.nome});
    }
  });

  return out;
}

function assinatura(pl){
  return pl.map(x=>(x.camp?'C':'P')+x.path+(x.duracao||0)).join('|');
}

/* ---- liberação explícita de recursos de mídia ----
   Remover o elemento do DOM NÃO libera o decoder nem os buffers: o
   Chromium só devolve na destruição do player, que depende do GC. Em
   24/7 isso não pode ficar por conta do GC. Aqui a liberação é feita
   na mão, na hora da troca. */
function liberarMidia(node){
  if(!node) return;
  const vs = node.querySelectorAll ? node.querySelectorAll('video') : [];
  for(const v of vs){
    try{
      v.onended = null; v.onerror = null;
      v.pause();
      v.removeAttribute('src');
      while(v.firstChild) v.removeChild(v.firstChild);
      v.load();               // devolve decoder e buffers agora, não no GC
    }catch(e){}
  }
  const ims = node.querySelectorAll ? node.querySelectorAll('img') : [];
  for(const im of ims){
    try{ im.onerror = null; im.removeAttribute('src'); }catch(e){}
  }
}

/* marca um item como indisponível e tira do rodízio (em vez de reciclar
   o mesmo erro volta após volta). Se tudo falhar, mostra tela de estado. */
function marcarIndisponivel(path){
  if(!path) return;
  if(!indisponiveis.has(path)){ erros++; logar('MIDIA-FALHOU '+String(path).slice(-40)); }

  /* NUNCA sacrificar o ultimo item. Barrar a unica midia do canal deixa a
     tela em estado de espera permanente — pior do que insistir numa midia
     problematica. Com 1 item, apenas registramos e tentamos de novo. */
  if(playlist.length <= 1){
    logar('MIDIA-FALHOU no unico item: repetindo em vez de barrar');
    return;
  }

  indisponiveis.add(path);
  const restantes = playlist.filter(x=> !indisponiveis.has(x.path));
  if(restantes.length === 0){
    // todos falharam: libera todos e recomeca, em vez de morrer na tela
    logar('TODOS indisponiveis: liberando para nova tentativa');
    indisponiveis.clear();
  }
}

/* ================= REPRODUÇÃO ================= */
function tocar(){
  if(playlist.length===0){
    showMsg('Sem conteúdo programado para este canal.<br>Cadastre mídias no painel BlinPlay.', false);
    return;
  }
  // pula itens já marcados como indisponíveis; se todos falharam, para aqui
  if(indisponiveis.size){
    let tentativas = 0;
    while(indisponiveis.has(playlist[idx].path) && tentativas < playlist.length){
      idx = (idx + 1) % playlist.length; tentativas++;
    }
    if(tentativas >= playlist.length){
      showMsg('Aguardando mídia do canal.<br>Verifique a programação no painel BlinPlay.', true);
      return;
    }
  }

  hideMsg();
  semMidiaAvisado = false;
  const g = ++geracao;            // nova geração: invalida callbacks antigos
  clearTimeout(slideTimer);
  clearTimeout(errTimer);
  // encerra timers/intervalos do vídeo anterior (watchdog e vigia de travamento)
  if(window.__vidTimers){ window.__vidTimers.forEach(t=> t.tipo==='i' ? clearInterval(t.id) : clearTimeout(t.id)); }
  window.__vidTimers = [];

  const item = playlist[idx];
  const stage = document.getElementById('stage');

  // o slide que sai continua decodificando até ser removido. Pausa agora.
  if(stage.lastElementChild){
    const anterior = stage.lastElementChild;
    const va = anterior.querySelector && anterior.querySelector('video');
    if(va){ try{ va.pause(); }catch(e){} }
  }

  // cria o slide novo
  const slide = document.createElement('div');
  slide.className = 'slide';
  const url = MEDIA_BASE + item.path;

  if(item.tipo === 'video'){
    const v = document.createElement('video');
    /* AUDIO: canal de hotel toca COM som.
       O elemento nasce mudo apenas porque navegador nao concede autoplay
       com audio sem gesto do usuario — se nascer com som, o play() e
       recusado e a tela fica parada. A saida e iniciar mudo, pedir play, e
       desmutar no primeiro sinal de que esta tocando: nesse ponto o
       autoplay ja foi concedido e o navegador nao bloqueia mais. */
    v.src = url; v.muted = true; v.autoplay = true; v.playsInline = true;
    v.preload = 'auto';
    v.volume = 1;

    const liberarAudio = ()=>{
      if(g !== geracao) return;
      if(!v.muted) return;
      try{
        v.muted = false;
        v.volume = 1;
      }catch(e){}
      // se o navegador reagir pausando, devolve o mudo para nao parar a tela:
      // conteudo tocando sem som e ruim, tela parada e pior
      setTimeout(()=>{
        if(g !== geracao) return;
        if(v.paused){
          try{ v.muted = true; v.play().catch(()=>{}); }catch(e){}
          logar('AUDIO recusado pelo navegador: seguindo mudo');
        }
      }, 300);
    };
    v.addEventListener('playing',    liberarAudio, { once:true });
    v.addEventListener('timeupdate', liberarAudio, { once:true });
    slide.dataset.video = '1';

    /* CANAL COM UM UNICO VIDEO -> LOOP NATIVO.
       Sem isso, cada volta destruia e recriava o elemento, e o intervalo
       entre criar e ter o primeiro quadro e exatamente onde o WebView
       desenha o placeholder claro. Com loop nativo nao existe troca:
       nao ha flash, e desaparecem ~600 criacoes de <video> por dia. */
    const loopUnico = (playlist.length === 1);
    if(loopUnico){
      v.loop = true;
      logar('LOOP NATIVO ativado (canal de 1 video)');
    }

    // CONTAGEM DE VOLTA NO LOOP NATIVO.
    // Com loop=true o 'ended' nunca dispara (o navegador reinicia sozinho),
    // então sem isso "voltas" ficaria travado em 0 pra sempre num canal de
    // 1 vídeo. Detectamos o próprio reinício pelo salto de currentTime (de
    // perto do fim direto pra perto de 0) e contamos ali — 1 volta = 1
    // reprodução completa do vídeo, igual antes do loop nativo existir.
    // IMPORTANTE: só conta quando estava PERTO DO FIM e caiu PERTO DO INÍCIO.
    // Um soluço de rede/decodificação no meio do vídeo também recua o
    // currentTime um pouco — sem essa checagem dupla, cada tropeço no meio
    // da reprodução era contado como uma volta inteira, inflando o número
    // bem mais rápido que a duração real do vídeo (foi o que voltou a
    // acontecer com a checagem simples de antes).
    if(loopUnico){
      let ultimoTempoVolta = 0;
      v.addEventListener('timeupdate', ()=>{
        if(g !== geracao) return;
        const dur = v.duration;
        if(dur && ultimoTempoVolta > dur - 1.5 && v.currentTime < 1.5){
          voltas++; logar('VOLTA #'+voltas+' concluida (loop nativo)');
        }
        ultimoTempoVolta = v.currentTime;
      });
    }
    // ---------------------------------------------------------------
    // AVANÇO DE VÍDEO — robusto para WebView de Android TV (Fully Kiosk)
    //
    // Regra de ouro: para VÍDEO nunca usamos a duração cadastrada no banco
    // (duracao_seg). Ela costuma ser um valor placeholder (ex: 30) e cortava
    // o vídeo no meio. Quem manda é o próprio vídeo, via evento 'ended'.
    //
    // Problema conhecido: o WebView do Android TV às vezes NÃO fornece
    // video.duration no 'loadedmetadata' (fica Infinity/NaN até o play andar).
    // Por isso não confiamos em um único evento nem criamos um teto curto.
    // ---------------------------------------------------------------
    let watchdog = null;
    const cancelaWatchdog = ()=>{ if(watchdog){ clearTimeout(watchdog); watchdog = null; } };

    // (1) fim natural do vídeo: é o caminho normal de avanço.
    //     A guarda `g !== geracao` impede que um callback de um slide já
    //     substituído dispare um avanço extra (cadeia órfã).
    v.onended = ()=>{ if(g !== geracao) return; cancelaWatchdog(); avancar(); };
    v.onerror = ()=>{
      if(g !== geracao) return;
      cancelaWatchdog();
      clearTimeout(slideTimer);
      clearTimeout(errTimer);
      logar('VIDEO-ERRO code='+((v.error&&v.error.code)||'?')+' '+String(item.path).slice(-34));
      marcarIndisponivel(item.path);
      // timer RASTREADO: no v2.7 este setTimeout não era guardado em lugar
      // nenhum e portanto não podia ser cancelado — cada erro nascia um
      // <video> novo por segundo, indefinidamente.
      errTimer = setTimeout(()=>{ if(g !== geracao) return; avancar(); }, 1500);
    };

    // (2) quando (e SE) a duração real ficar disponível — pode vir em
    // loadedmetadata, durationchange ou já durante o playback — armamos um
    // watchdog de "duração real + 5s" só como proteção contra travamento.
    const tentaArmarPorDuracao = ()=>{
      if(g !== geracao) return;
      if(loopUnico) return;     // em loop nativo nunca avancamos: recriar = flash
      if(isFinite(v.duration) && v.duration > 0){
        cancelaWatchdog();
        watchdog = setTimeout(()=>{ if(g !== geracao) return; avancar(); }, (v.duration * 1000) + 5000);
        window.__vidTimers.push({ tipo:'t', id: watchdog });
      }
    };
    v.addEventListener('loadedmetadata', tentaArmarPorDuracao);
    v.addEventListener('durationchange', tentaArmarPorDuracao);
    v.addEventListener('playing', tentaArmarPorDuracao);

    // (3) WATCHDOG DE TRAVAMENTO (independe da duração do banco):
    // se o tempo do vídeo parar de avançar por muito tempo (rede caiu, arquivo
    // corrompido) e o 'ended' nunca chegar, pulamos o item. Enquanto o vídeo
    // estiver progredindo, o relógio é rearmado — então vídeo longo toca inteiro.
    let ultimoTempo = 0, paradoDesde = Date.now();
    v.addEventListener('timeupdate', ()=>{
      if(v.currentTime > ultimoTempo + 0.25){ ultimoTempo = v.currentTime; paradoDesde = Date.now(); }
      // loop nativo reinicia o currentTime pra perto de 0: sem isso o
      // watchdog interpretava a queda como "parou de progredir" e, uns 20s
      // depois, disparava avancar() por engano a cada loop — contando
      // "voltas" bem mais rápido que a duração real do vídeo.
      else if(v.currentTime < ultimoTempo - 1){ ultimoTempo = v.currentTime; paradoDesde = Date.now(); }
    });
    const STALL_MS = 20000; // 20s sem progresso = travou de verdade
    const vigia = setInterval(()=>{
      if(g !== geracao){ clearInterval(vigia); return; }
      if(!document.body.contains(v)){ clearInterval(vigia); return; }
      if(Date.now() - paradoDesde > STALL_MS){
        clearInterval(vigia);
        // travou de verdade: tira do rodízio para não reciclar o mesmo erro
        if(ultimoTempo === 0) marcarIndisponivel(item.path);
        logar('TRAVOU t='+ultimoTempo.toFixed(1)+'s '+String(item.path).slice(-34));
        avancar();
      }
    }, 3000);
    window.__vidTimers.push({ tipo:'i', id: vigia });

    slide.appendChild(v);
    // NÃO armamos setTimeout(avancar) com base em duracao_seg aqui.
    // O vídeo avança por 'ended' (normal) ou pelo watchdog de travamento.
  } else {
    const im = document.createElement('img');
    im.src = url;
    im.onerror = ()=> {
      if(g !== geracao) return;
      clearTimeout(slideTimer);
      clearTimeout(errTimer);
      marcarIndisponivel(item.path);
      errTimer = setTimeout(()=>{ if(g !== geracao) return; avancar(); }, 1500);
    };
    slide.appendChild(im);
    // IMAGEM: usa a duração definida no painel (duracao_seg), padrão 8s se nula
    slideTimer = setTimeout(()=>{ if(g !== geracao) return; avancar(); }, (item.duracao || 8) * 1000);
  }

  stage.appendChild(slide);

  /* REVELACAO CONDICIONADA AO PRIMEIRO QUADRO.
     Antes: o slide era revelado no frame seguinte, com o <video> ainda vazio
     -> o WebView pintava o placeholder nativo dele (retangulo claro com botao
     de play) por 1 a 2 segundos a cada troca.
     Agora: o slide nasce invisivel e decodifica em segundo plano. Enquanto
     nao houver imagem, o slide ANTERIOR continua na tela. A troca fica
     limpa, sem branco nenhum. */
  const revelar = ()=>{
    if(g !== geracao) return;
    if(slide.classList.contains('on')) return;
    slide.classList.add('on');
    // limpeza somente DEPOIS da transicao de 0.6s terminar
    const tLimpa = setTimeout(()=>{
      while(stage.children.length > 2){
        const velho = stage.firstChild;
        liberarMidia(velho);
        stage.removeChild(velho);
      }
    }, 700);
    window.__vidTimers.push({ tipo:'t', id: tLimpa });
  };

  if(slide.dataset.video === '1'){
    const v0 = slide.querySelector('video');
    if(v0.readyState >= 2){ revelar(); }
    else {
      v0.addEventListener('loadeddata', revelar, { once:true });
      v0.addEventListener('playing',    revelar, { once:true });
      // rede de seguranca: nunca deixar a tela presa no slide anterior
      const tRev = setTimeout(revelar, 4000);
      window.__vidTimers.push({ tipo:'t', id: tRev });
    }
  } else {
    const im0 = slide.querySelector('img');
    if(im0 && im0.complete){ revelar(); }
    else if(im0){
      im0.addEventListener('load',  revelar, { once:true });
      im0.addEventListener('error', revelar, { once:true });
      const tRev = setTimeout(revelar, 3000);
      window.__vidTimers.push({ tipo:'t', id: tRev });
    } else { revelar(); }
  }

  // selo de campanha
  const flag = document.getElementById('flag');
  if(item.camp){ flag.textContent = '● ' + (item.campNome||'Campanha'); flag.classList.add('show'); }
  else flag.classList.remove('show');

  // (a limpeza dos slides antigos migrou para dentro de revelar(), para nao
  //  remover o slide visivel antes de o novo ter imagem)
}

function avancar(){
  clearTimeout(slideTimer);
  clearTimeout(errTimer);
  if(playlist.length === 0) return;
  const anterior = idx;
  idx = (idx + 1) % playlist.length;
  trocas++;
  // com playlist de 1 item, idx nunca muda -> cada avanco E uma volta
  if(playlist.length === 1 || (idx === 0 && anterior !== 0)){
    voltas++; logar('VOLTA #'+voltas+' concluida');
  }
  tocar();
}

/* ================= SINCRONIZAÇÃO ================= */
async function sincronizar(primeira){
  // reporta a versão logo de cara (independente do resto), na primeira carga
  if(primeira){
    try{ await sb.rpc('reportar_versao', { p_token: token, p_versao: PLAYER_VERSION }); }
    catch(e){ console.log('reportar_versao falhou:', e); }
  }
  try{
    const { data, error } = await sb.rpc('get_player_schedule', { p_token: token });
    if(error) throw error;
    if(!data || data.ok === false){
      showMsg('Token inválido ou canal inativo.<br>Verifique a URL configurada no box.', false);
      return;
    }
    // guarda a última programação boa (pra abrir offline na próxima vez)
    try{ localStorage.setItem('blinplay_sched_'+token, JSON.stringify(data)); }catch(e){}
    if(data.canal && data.canal.id) CHANNEL_ID = data.canal.id;
    logar('SYNC ok itens='+((data.padrao||[]).length)+' camp='+((data.campanhas||[]).length));

    // se o Realtime ficou adiado por falta de CHANNEL_ID, liga agora
    if(CHANNEL_ID && !rtChannel && navigator.onLine) ligarRealtime();

    // portao: se ainda nao foi liberado, nao toca nada
    if(primeira && autorizado === null){
      const ok = await verificarAutorizacao();
      apresentarBox();
      if(!ok){ telaAguardandoAutorizacao(); return; }
    }
    // ORDEM IMPORTA: a midia vai PRIMEIRO. aplicarPrograma() chama tocar()
    // de forma sincrona; se tocar() lancar excecao, ela sobe e o catch abaixo
    // engoliria a chamada de precarregarMidias. Era exatamente o que acontecia.
    try{ precarregarMidias(data); }
    catch(e){ logar('PRECARREGAR falhou: '+String(e&&e.message||e).slice(0,70)); }
    try{ aplicarPrograma(data, primeira); }
    catch(e){ logar('APLICAR/TOCAR falhou: '+String(e&&e.message||e).slice(0,80)); }
  }catch(ex){
    logar('SYNC falhou: '+String((ex&&ex.message)||ex).slice(0,70));
    // sem rede: se não há nada tocando, tenta a última programação salva
    if(playlist.length===0){
      let salvo=null;
      try{ salvo=JSON.parse(localStorage.getItem('blinplay_sched_'+token)); }catch(e){}
      if(salvo){ aplicarPrograma(salvo, true); }
      else showMsg('Sem conexão com o servidor.<br>Tentando novamente…', true);
    }
    // se já está tocando, mantém tocando (resiliência total)
  }
}

function aplicarPrograma(data, primeira){
  const nova = montarPlaylist(data);
  const sig = assinatura(nova);
  /* A1 — No primeiro carregamento SEMPRE chama tocar(), mesmo sem mudança de
     assinatura. Com canal recém-criado a playlist vem vazia, a assinatura
     continua igual à inicial, o tocar() nunca era chamado e o box ficava no
     spinner para sempre — enquanto a mensagem "Sem conteúdo programado",
     que existe dentro do tocar(), era inalcançável. */
  if(sig !== lastSig || primeira){
    lastSig = sig;
    playlist = nova;
    programaAplicado = true;
    if(primeira || idx >= playlist.length) idx = 0;
    tocar();
  }
}

// pede ao navegador pra baixar todas as mídias da playlist agora (vão pro cache do SW)
function precarregarMidias(data){
  const todas = [];
  (data.padrao||[]).forEach(m=> todas.push(m.path));
  (data.campanhas||[]).forEach(c=> (c.itens||[]).forEach(it=> todas.push(it.path)));

  const urls = todas.map(p=> MEDIA_BASE + p);
  registrarEsperados(todas);      // lista de referencia para a auditoria

  /* M5 — o fetch era incondicional a cada sincronização. Com o Realtime
     disparando re-sync, uma tarde movimentada no painel fazia cada box
     rebaixar o conjunto inteiro de mídias repetidas vezes. Pior: no-cors
     devolve resposta opaca, que ocupa cota com padding pesado — trabalhando
     contra o problema de eviction que o resto do código existe para medir.
     Agora só busca o que realmente falta. */
  (async ()=>{
    let c = null;
    try{ if('caches' in window) c = await caches.open('media-v1'); }catch(e){}
    for(const url of urls){
      try{
        if(c && await c.match(url)) continue;      // já está em cache
        fetch(url, { mode:'no-cors' }).catch(()=>{});
      }catch(e){
        fetch(url, { mode:'no-cors' }).catch(()=>{});
      }
    }
  })();

  // 2a) ARMAZENAMENTO NATIVO: se o APK expõe a ponte, ele passa a ser o
  //     responsável pela mídia. Avisa o SW para sair da frente e manda a
  //     lista para o Kotlin baixar e guardar como arquivo do app.
  if(NATIVO){
    try{
      window.BlinPlayNative.sincronizarMidias(JSON.stringify(todas));
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.controller.postMessage({ tipo:'nativo' });
      }
      logar('NATIVO sync solicitado: '+todas.length+' midias');
    }catch(e){ logar('NATIVO falhou: '+String(e&&e.message||e).slice(0,60)); }
    return;   // no modo nativo não usa Cache API para mídia
  }

  // 2) pede ao SW para revalidar o que JÁ está em cache: se a mídia foi
  //    trocada no portal com o mesmo nome de arquivo, o ETag/tamanho muda
  //    e o SW rebaixa. É assim que a troca no portal chega ao box.
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({ tipo:'revalidar', urls });
    }
  }catch(e){}

  // 3) itens que voltaram à programação ganham nova chance
  if(indisponiveis.size){
    let reabilitou = false;
    todas.forEach(path=>{ if(indisponiveis.delete(path)) reabilitou = true; });
    if(reabilitou && playlist.length && document.getElementById('msg').classList.contains('show')){
      idx = 0; tocar();
    }
  }
}

/* ================= REALTIME =================
   Assina mudanças nas tabelas que afetam a programação. Em vez de
   ficar perguntando ao banco, o player é AVISADO no instante da mudança
   e re-sincroniza na hora (com debounce pra agrupar rajadas de eventos).
   Se a conexão cair, o setInterval de fallback (5 min) cobre o intervalo.
*/
function ligarRealtime(){
  clearTimeout(rtRetry);
  if(rtChannel){ try{ sb.removeChannel(rtChannel); }catch(e){} rtChannel = null; }
  if(!navigator.onLine) return;      // offline: não cria canal à toa

  /* Os filtros abaixo dependem de CHANNEL_ID. Se o primeiro sync falhou
     (boot offline), ele ainda é nulo e o filtro viraria "id=eq.null", que não
     casa com nada — o box ficaria sem Realtime em silêncio. Nesse caso não
     assinamos; ligarRealtime é chamada de novo quando o id chegar. */
  if(!CHANNEL_ID){
    logar('RT adiado: canal ainda nao identificado');
    return;
  }

  const aoMudar = ()=>{
    clearTimeout(rtDebounce);
    rtDebounce = setTimeout(()=> sincronizar(false), 800); // agrupa eventos em 0,8s
  };

  // mudança no canal: pode ser conteúdo OU um pedido de refresh remoto
  const aoMudarCanal = (payload)=>{
    const novo = payload && payload.new ? payload.new : null;
    // se é o NOSSO canal e veio um pedido de refresh recente, recarrega a página
    // pedido de miniatura da tela (mesmo padrao do refresh_pedido_em)
    if(novo && CHANNEL_ID && novo.id===CHANNEL_ID && novo.snap_pedido_em){
      const q = new Date(novo.snap_pedido_em).getTime();
      if(q > snapUltimoPedido && (Date.now() - q) < 120000){
        snapUltimoPedido = q;
        setTimeout(()=> enviarSnap('pedido'), 200);
      }
    }

    if(novo && CHANNEL_ID && novo.id===CHANNEL_ID && novo.refresh_pedido_em){
      const quando = new Date(novo.refresh_pedido_em).getTime();
      if(Date.now() - quando < 60000){   // pedido dos últimos 60s
        location.reload();
        return;
      }
    }
    aoMudar();
  };

  rtChannel = sb.channel('blinplay-' + (CHANNEL_ID||token))
    /* A3 — as assinaturas eram em tabelas INTEIRAS, sem filtro. Uma edição em
       qualquer hotel acordava os 150 boxes ao mesmo tempo, e cada box recebia
       as linhas de canal dos outros clientes pelo socket.
       Agora tudo que tem channel_id é filtrado pelo canal deste box, e a
       tabela channels pelo id. O que não tem coluna de canal (campaigns)
       continua amplo, mas o aoMudar já ignora o que não muda a assinatura. */
    .on('postgres_changes', { event:'*', schema:'public', table:'playlist_items',
        filter: 'channel_id=eq.' + CHANNEL_ID }, aoMudar)
    .on('postgres_changes', { event:'*', schema:'public', table:'campaign_channels',
        filter: 'channel_id=eq.' + CHANNEL_ID }, aoMudar)
    .on('postgres_changes', { event:'*', schema:'public', table:'campaigns'      }, aoMudar)
    .on('postgres_changes', { event:'*', schema:'public', table:'campaign_items' }, aoMudar)
    .on('postgres_changes', { event:'*', schema:'public', table:'channels',
        filter: 'id=eq.' + CHANNEL_ID }, aoMudarCanal)
    .subscribe((status)=>{
      if(status==='SUBSCRIBED'){
        realtimeOK = true;
        rtEspera = 10000;              // reconectou: zera o recuo
        return;
      }
      if(status==='CLOSED' || status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        realtimeOK = false;
        // RECUO EXPONENCIAL, teto de 5 min. E se o box esta offline, NAO
        // insiste: espera o evento 'online'. Sem isso, um box que nunca
        // mais ve internet recria canal a cada 10s pelo resto da vida --
        // 3 milhoes de recriacoes por ano dentro do supabase-js.
        clearTimeout(rtRetry);
        if(!navigator.onLine){
          logar('RT offline: reconexao suspensa ate a rede voltar');
          return;
        }
        rtEspera = Math.min(rtEspera * 2, 300000);
        rtRetry = setTimeout(ligarRealtime, rtEspera);
      }
    });
}

// VERIFICAÇÃO PERIÓDICA (sempre ativa): a cada 15s busca a programação atual
// e, se algo mudou (campanha, conteúdo) ou há pedido de refresh, recarrega a
// página. Funciona mesmo quando o Realtime conecta mas não entrega eventos.
function ligarFallback(){
  if(resyncTimer) return;
  let tickPoll = 0;
  resyncTimer = setInterval(async ()=>{
    if(!navigator.onLine) return;     // offline: não gasta CPU com RPC que vai falhar

    /* A2 — realtimeOK era escrita e nunca lida: o polling de 15s rodava sempre,
       mesmo com o Realtime saudável entregando os mesmos eventos. Em 150 boxes
       são ~600 RPCs por minuto sem função nenhuma. Com o Realtime confirmado,
       o polling vira rede de segurança e cai para 2 minutos. */
    tickPoll++;
    if(realtimeOK && (tickPoll % 8 !== 0)) return;

    try{
      // 1) pedido de refresh remoto?
      const r = await sb.rpc('checar_refresh', { p_token: token });
      if(r && r.data){
        const quando = new Date(r.data).getTime();
        if(Date.now()-quando < 20000){ location.reload(); return; }
      }
    }catch(e){}
    try{
      // 2) a programação mudou?
      const { data } = await sb.rpc('get_player_schedule', { p_token: token });
      if(data && data.ok!==false){
        const novaSig = assinatura(montarPlaylist(data));

        /* LAÇO DE RELOAD — causa da queda de hoje.
           Se o sincronizar() retornasse antes do aplicarPrograma() por
           qualquer motivo, lastSig ficava vazio. Aqui a assinatura nova
           sempre diferia da vazia, o player concluía "a programação mudou" e
           recarregava. No reload tudo se repetia: BOOT a cada 2 minutos, sem
           nunca chegar a tocar.

           Duas travas:
           1) Programa nunca aplicado (lastSig vazio) não é motivo para
              recarregar — é motivo para APLICAR. Recarregar não resolveria
              nada que aplicar direto já não resolva.
           2) Teto de recargas por sessão, para que nenhum caminho futuro
              consiga transformar isso num laço outra vez. */
        if(!programaAplicado){
          logar('PROGRAMA ainda nao aplicado — aplicando em vez de recarregar');
          aplicarPrograma(data, true);
          return;
        }
        if(novaSig !== lastSig){
          if(recargas >= MAX_RECARGAS){
            logar('RELOAD bloqueado: teto de '+MAX_RECARGAS+' por sessao atingido');
            aplicarPrograma(data, false);
            return;
          }
          recargas++;
          logar('PROGRAMA mudou — recarregando ('+recargas+'/'+MAX_RECARGAS+')');
          location.reload(); return;
        }
        // reporta presença (mantém "online" e atualiza último acesso)
        sb.rpc('reportar_versao', { p_token: token, p_versao: PLAYER_VERSION }).catch(()=>{});   // M12: promise não aguardada precisa de .catch
      }
    }catch(e){}
  }, 15000);
}

/* ================= INÍCIO ================= */
async function init(){
  const params = new URLSearchParams(location.search);
  DIAG = params.get('diag') === '1';
  iniciarDiag();
  token = params.get('token');
  let code = (params.get('code')||'').trim();
  if(code){ try{ localStorage.setItem('blinplay_ultimo_code', code); }catch(e){} }

  // se o "token" informado for só 6 dígitos, na verdade é um código curto
  if(!code && token && /^\d{6}$/.test(token.trim())){ code = token.trim(); token = null; }

  /* C4 — A CDN NÃO PODE SEGURAR O BOOT.
     Antes: window.supabase.createClient() sem guarda. Se o jsdelivr estivesse
     inacessível, isso lançava TypeError, o init morria no meio e a TV ficava
     no spinner — mesmo tendo programação e mídia salvas localmente. O caminho
     offline existia e era inalcançável.
     Agora: sem a biblioteca, o player toca do que está salvo e tenta de novo
     a cada 60s. Conteúdo no ar vale mais que conexão com o servidor. */
  if(!window.supabase || !window.supabase.createClient){
    logar('SDK Supabase indisponivel — entrando em modo local');
    tentarModoLocal(code, token);
    setInterval(()=>{
      if(window.supabase && window.supabase.createClient && !sb){
        logar('SDK Supabase voltou — religando');
        location.reload();
      }
    }, 60000);
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY);

  // se veio por código curto (6 dígitos), resolve pro token real
  if(!token && code){
    showMsg('Carregando…', true);
    let salvoTok = null;
    try{ salvoTok = localStorage.getItem('blinplay_code_'+code); }catch(e){}
    try{
      const { data, error } = await sb.rpc('resolver_codigo', { p_codigo: code });
      if(!error && data){
        token = data;
        try{ localStorage.setItem('blinplay_code_'+code, data); }catch(e){}
      } else if(salvoTok){
        token = salvoTok;   // offline: usa o token já resolvido antes
      }
    }catch(e){
      if(salvoTok) token = salvoTok;   // sem rede: cai no cache
    }
  }

  if(!token){
    showMsg('Nenhum canal configurado.<br>Abra esta página com o código da estação:<br><br><code>player.html?code=000000</code>', false);
    return;
  }

  showMsg('Carregando programação…', true);

  // Token definitivo em mãos: descarta o estado local de um canal anterior
  // ANTES de qualquer envio, para não subir a fila do hotel errado.
  limparEstadoDeOutroCanal();

  // ARMAZENAMENTO PERSISTENTE: sem isso o Android tem licença para descartar
  // o cache inteiro sob pressão de storage — e todo o offline vira sorte.
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().then(ok=>{
        persistOK = ok ? 'CONCEDIDO' : 'NEGADO';
        logar('PERSIST '+persistOK);
      }).catch(()=>{ persistOK='ERRO'; logar('PERSIST erro'); });
    }
  }catch(e){}

  // HIGIENE 24/7: recarrega a página uma vez por dia, na madrugada, para
  // zerar qualquer resíduo do WebView. O reload funciona offline (o SW
  // serve o shell do cache com ignoreSearch).
  setInterval(()=>{
    /* Fuso FIXO em America/Sao_Paulo, não o do aparelho.
       O inventário da frota mostrou boxes configurados como
       America/Argentina/Buenos_Aires e America/Santiago — neles, "4h da
       manhã" cairia em outra hora local, possivelmente com hóspede acordado.
       A operação é brasileira; a janela de manutenção também deve ser. */
    let h;
    try{
      h = parseInt(new Intl.DateTimeFormat('pt-BR', {
        hour: 'numeric', hour12: false, timeZone: 'America/Sao_Paulo'
      }).format(new Date()), 10);
    }catch(e){
      h = new Date().getHours();   // aparelho sem suporte a Intl: usa o local
    }
    if(h === 4) location.reload();
  }, 55 * 60 * 1000);

  // registra o Service Worker (cache offline) e cuida da auto-atualização
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      logar('SW registrado escopo='+(reg.scope||'?')+' estado='+estadoSW());
      // procura atualização do SW a cada 30 min (boxes ficam ligados 24/7)
      setInterval(()=>{ reg.update().catch(()=>{}); }, 30*60*1000);
    }).catch((e)=>{ logar('SW FALHOU AO REGISTRAR: '+String(e&&e.message||e).slice(0,90)); });
    // quando um SW novo assume o controle, recarrega 1x pra pegar a versão nova
    let jaRecarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(jaRecarregou) return; jaRecarregou = true;
      location.reload();
    });
  }

  sincronizar(true).then(()=>{ ligarRealtime(); ligarFallback(); });

  // mantém a tela acordada (best-effort; o Fully reforça isso no box)
  if('wakeLock' in navigator){
    const lock = ()=> navigator.wakeLock.request('screen').catch(()=>{});
    lock();
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) lock(); });
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
